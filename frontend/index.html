<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WannaGo — Lugares para conhecer</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ══ HEADER ══ -->
  <header class="app-header">
    <div class="container">
      <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
        <div>
          <h1 class="app-title mb-0">WannaGo</h1>
          <p class="app-subtitle mb-0">o seu mapa de lugares para conhecer</p>
        </div>
        <div id="resumo" class="resumo-pills"></div>
      </div>
    </div>
  </header>

  <main class="container">

    <!-- ══ FORMULÁRIO ══ -->
    <section class="card form-card mb-4">
      <div class="card-body">
        <h2 class="section-title">Adicionar um novo lugar</h2>
        <form id="form-lugar" class="row g-3">

          <div class="col-12 col-md-5">
            <label for="nome" class="form-label">Nome do lugar</label>
            <input type="text" class="form-control" id="nome" name="nome" placeholder="Ex: Chapada Diamantina" required />
          </div>

          <div class="col-12 col-md-4">
            <label for="pais" class="form-label">País</label>
            <input type="text" class="form-control" id="pais" name="pais" placeholder="Ex: Brasil" required />
          </div>

          <div class="col-12 col-md-3">
            <label for="categoriaId" class="form-label">Categoria</label>
            <select class="form-select" id="categoriaId" name="categoriaId">
              <option value="">Selecione...</option>
            </select>
          </div>

          <div class="col-12 col-md-4">
            <label for="status" class="form-label">Status</label>
            <select class="form-select" id="status" name="status">
              <option value="sonho">Sonho</option>
              <option value="planejando">Planejando</option>
              <option value="visitado">Visitado</option>
            </select>
          </div>

          <div class="col-12 col-md-8">
            <label for="imagemUrl" class="form-label">Imagem (URL) <span class="text-muted">— opcional</span></label>
            <input type="url" class="form-control" id="imagemUrl" name="imagemUrl" placeholder="https://..." />
          </div>

          <div class="col-12">
            <button type="submit" class="btn btn-primary">
              Adicionar lugar
            </button>
          </div>
        </form>
      </div>
    </section>

    <!-- ══ FILTROS ══ -->
    <section class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
      <h2 class="section-title mb-0">Seus lugares</h2>
      <div class="btn-group" role="group" aria-label="Filtrar por status" id="filtros">
        <button type="button" class="btn btn-outline-secondary btn-sm active" data-status="">Todos</button>
        <button type="button" class="btn btn-outline-secondary btn-sm" data-status="sonho">Sonho</button>
        <button type="button" class="btn btn-outline-secondary btn-sm" data-status="planejando">Planejando</button>
        <button type="button" class="btn btn-outline-secondary btn-sm" data-status="visitado">Visitado</button>
      </div>
    </section>

    <!-- ══ ALERTAS / FEEDBACK ══ -->
    <div id="feedback"></div>

    <!-- ══ LISTA DE LUGARES ══ -->
    <section id="lista-lugares" class="row g-3 mb-5">
      <!-- cards injetados via JS -->
    </section>

    <!-- ══ ESTADO VAZIO ══ -->
    <div id="estado-vazio" class="empty-state d-none text-center py-5">
      <p class="mb-1 fs-4">Sua lista está vazia</p>
      <p class="text-muted">Adicione o primeiro lugar que você quer conhecer ali em cima ☝️</p>
    </div>

  </main>

  <footer class="app-footer text-center py-4">
    <small>WannaGo — Projeto Fullstack Básico</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Módulos da aplicação -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
